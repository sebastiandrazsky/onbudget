# Validates the plugin and runs its zero-cost suites against the Claude Code release current at the time of the run:
# on every push and pull request, and weekly, so that a release that changes the mods API shows up here first.
# Nothing here makes a model request: run.py answers every request with a scripted model, and wire.py sends them to a
# fake API on localhost with a fake key.
name: plugin
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
# The workflow reads the repository and nothing else: no token scope beyond read, no secrets.
permissions:
  contents: read
jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit; the comment names the release it is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Claude Code from npm, with the runner's own Node: the release current at the time of the run, in a prefix of its own.
      - name: Install the current Claude Code from npm
        run: |
          node --version
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Claude Code version, and where it runs from
        run: |
          command -v claude
          claude --version
      - name: Validate (the plugin manifest, then the marketplace manifest)
        run: |
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .
      - name: In-engine tests
        run: claude plugin test .
      - name: End to end, scripted model
        run: python3 tests/e2e/run.py
      - name: End to end, fake API on localhost
        run: python3 tests/e2e/wire.py
